<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="strand" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="apex" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5C26B"/>
      <stop offset="100%" stop-color="#E8A33D"/>
    </radialGradient>
  </defs>

  <!-- Left leg: converging strands (the many) -->
  <path d="M 30 178 L 100 34" fill="none" stroke="url(#strand)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 52 178 L 100 34" fill="none" stroke="url(#strand)" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M 70 178 L 100 34" fill="none" stroke="url(#strand)" stroke-width="1" stroke-linecap="round" opacity="0.3"/>

  <!-- Right leg: converging strands -->
  <path d="M 170 178 L 100 34" fill="none" stroke="url(#strand)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 148 178 L 100 34" fill="none" stroke="url(#strand)" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M 130 178 L 100 34" fill="none" stroke="url(#strand)" stroke-width="1" stroke-linecap="round" opacity="0.3"/>

  <!-- Crossbar: the unified platform (the one) -->
  <rect x="52" y="118" width="96" height="11" rx="5.5" fill="#E8A33D"/>

  <!-- Apex: the single point where everything meets -->
  <circle cx="100" cy="34" r="7" fill="url(#apex)"/>
  <circle cx="100" cy="34" r="13" fill="none" stroke="#E8A33D" stroke-width="1" opacity="0.35"/>
</svg>
